<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Rehab Dashboard</title>
<meta name="description" content="Rehabilitation testing dashboard: exit criteria, LSI, GPS load and availability. Data stays on this device.">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">

<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1D428A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rehab">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">

<link rel="stylesheet" href="css/app.css">
</head>
<body>
<noscript><p class="noscript">This app needs JavaScript switched on.</p></noscript>
<div id="storageWarn" class="storage-warn" hidden>This browser is blocking local storage (private browsing or strict privacy settings), so nothing you enter can be saved. Open the app in a normal browser window.</div>

<div id="app"></div>

<div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
  <div class="modal-box">
    <h2 id="modalTitle"></h2>
    <p id="modalMsg"></p>
    <div class="modal-actions">
      <button type="button" class="btn" id="modalCancel">Cancel</button>
      <button type="button" class="btn primary" id="modalOk">OK</button>
    </div>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<div id="tip" class="tip" hidden></div>
<input type="file" id="importInput" accept=".json,application/json" hidden>
<input type="file" id="csvInput" accept=".csv,.txt,.zip,text/csv,text/plain,application/zip" hidden>

<script src="js/calc.js"></script>
<script src="js/csv.js"></script>
<script src="js/app.js"></script>
</body>
</html>
